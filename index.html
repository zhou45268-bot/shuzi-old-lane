<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24160f"><title>梳忆·老巷木梳坊</title>
<style>
:root{--gold:#e8c37c;--ink:#29180f;--paper:#f6e6c6;--cream:#fff7e5;--muted:#a98960}*{box-sizing:border-box}body{margin:0;background:#1d120d;color:var(--paper);font-family:"Microsoft YaHei",serif}button{font:inherit;cursor:pointer;color:#ffe8b0;background:linear-gradient(#684426,#352015);border:1px solid #c49a54;border-radius:24px;padding:11px 18px;box-shadow:0 4px 12px #10090455}button:hover{filter:brightness(1.18);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.screen{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;padding:24px;background-position:center;background-size:cover;isolation:isolate}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#160d09c4,#160d0940,#160d09c4);z-index:-1}.home{background-image:url('home.png'),radial-gradient(ellipse at 50% 42%,#7e8b8a,#463b31 55%,#160d09)}.level{display:none;background-image:url('level.png'),radial-gradient(ellipse at 50% 30%,#9a9875,#59412a 50%,#160d09)}.panel{width:min(900px,100%);padding:clamp(20px,4vw,42px);background:#24160fe8;border:1px solid #c9a260;border-radius:10px;box-shadow:0 20px 80px #090604aa;backdrop-filter:blur(4px)}.home .panel{text-align:center;width:min(760px,100%)}h1{font-size:clamp(40px,7vw,76px);letter-spacing:.14em;margin:0;color:#f2d49a;text-shadow:0 4px 10px #100905}h2{color:#f3d7a2;letter-spacing:.1em}p{line-height:1.9}.sub{letter-spacing:.25em;color:#f4dfbd}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.pill{border:1px solid #b99051;background:#21140de8;padding:8px 14px;border-radius:30px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.tile{padding:16px 12px;background:#593a25ef;border:1px solid #b58b4e;border-radius:8px;min-height:105px;text-align:left}.tile b{display:block;color:#f5d8a0;margin-bottom:7px}.tile small{color:#e2c49a;line-height:1.6}.notice{min-height:48px;color:#f8dfaa}.progress{height:7px;background:#4b3020;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#e6bf71;transition:width .3s}.footer{font-size:12px;color:#dfc7a0;margin-top:20px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#100904d9;z-index:10}.modal.open{display:flex}.modalbox{width:min(600px,100%);padding:28px;background:#f3e2c0;color:#382418;border:5px double #9b7139;border-radius:8px;max-height:90vh;overflow:auto}.modalbox h2{color:#67401e}.modalbox button{margin-top:10px}.craftrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.craft{padding:14px 8px;background:#f3dfb7;color:#4c2c18;border:1px solid #b68a4c;border-radius:8px;text-align:center;cursor:pointer}.craft.selected{outline:3px solid #f0cf84}.craft.done{background:#dfe7c9;color:#304222}.patterns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pattern{padding:15px 8px;text-align:center;background:#f3dfb7;color:#4c2c18;border-radius:8px;border:1px solid #b68a4c;cursor:pointer}.pattern span{display:block;font-size:34px;color:#985d31}.design{display:grid;grid-template-columns:1fr 190px;gap:14px}.design canvas{width:100%;height:auto;background:#f8edda;border-radius:8px;touch-action:manipulation}.design aside button{display:block;width:100%;margin-bottom:9px;text-align:left}.modalbox .close{float:right;color:#4b2e1b;background:transparent;border:0;box-shadow:none;padding:0 8px;font-size:22px}@media(max-width:600px){.screen{padding:12px}.panel{padding:18px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.craftrow{grid-template-columns:repeat(2,1fr)}.patterns{grid-template-columns:repeat(2,1fr)}.design{grid-template-columns:1fr}.top{top:8px;left:8px;right:8px}.level{padding-top:75px}}
</style></head>
<body>
<main id="home" class="screen home"><section class="panel"><p class="sub">苏州木作非遗 · 水巷间的记忆</p><h1>梳忆</h1><h2>老巷木梳坊</h2><p>一把木梳，梳理岁月；一段旧巷，拾起记忆。<br>跟随陈师傅，从认识木料开始，亲手完成一把属于自己的雕花木梳。</p><div class="actions"><button onclick="startGame()">〈 推开木梳坊的门 〉</button><button onclick="showModal('游历图鉴','完成工序后可解锁祥云、牡丹、卷草、如意四种传统纹样。')">▧ 游历图鉴</button><button onclick="showModal('工坊设置','支持鼠标与触屏操作。工艺卡片可直接点击，设计完成后可下载 PNG 作品。')">⚙ 工坊设置</button></div><p class="footer">梳忆·老巷木梳坊 · 非遗文化互动体验</p></section></main>
<main id="level" class="screen level"><div class="top"><span class="pill">工坊学徒 · 记忆进度 <b id="count">0/6</b></span><span><button onclick="showModal('游历图鉴','已发现纹样：'+(state.motifs.size?[...state.motifs].join('、'):'尚未发现')+'。')">图鉴</button> <button onclick="showModal('回到首页','点击“重新开始”可以重走工坊旅程。')">设置</button></span></div><section class="panel"><p class="sub">陈师傅的木梳工坊</p><h1 style="font-size:clamp(30px,5vw,52px)">承艺制梳</h1><p id="intro">陈师傅：好孩子，做一把好梳子，先要认识木料与工具。咱们一步一步来。</p><div class="progress"><span id="bar"></span></div><div class="grid" id="tiles"></div><p id="notice" class="notice">选择一项开始探索。</p><div class="actions"><button onclick="showModal('陈师傅的叮嘱','梳子要圆，齿要顺，就像做人，要懂迂回，要知和顺。做手艺要有耐心，做人也一样。')">听陈师傅说</button><button onclick="restartGame()">重新开始</button></div><p class="footer">探索工艺、收集纹样、完成专属木梳设计。作品可保存到电脑。</p></section></main>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2 id="mtitle"></h2><div id="mbody"></div><div id="mextra"></div><button onclick="closeModal()">收好这段记忆</button></div></div>
<script>
const state={done:new Set(),motifs:new Set(),memories:new Set(),stage:0,tools:new Set(),placed:[]};
const steps=[
{id:'history',title:'旧时光影',desc:'听陈师傅讲木梳小史',small:'了解一把梳子背后的生活记忆。',body:'传统木梳制作讲究选材、制坯、开齿、修整、打磨与养护。不同作坊和产品的具体工序会有差异，匠人凭经验顺着木纹加工，让梳齿整齐、梳背温润。'},
{id:'wood',title:'挑选木料',desc:'观察木纹与完整度',small:'木料是好梳子的起点。',body:'选材要观察木纹、硬度与完整度。木料纹理是否顺畅、是否有裂痕，都会影响后续加工。选好材料后，还要顺着木性安排下刀方向。'},
{id:'teeth',title:'开齿成形',desc:'让梳齿整齐均匀',small:'间距、力度和耐心都重要。',body:'开齿讲究间距均匀、齿尖顺滑，力度要稳，才能尽量避免崩齿。梳齿的修整既影响外观，也关系到使用时是否顺手。'},
{id:'finish',title:'细磨上蜡',desc:'打磨边角并养护木面',small:'让木梳温润、顺手。',body:'细细打磨边角，让手触摸时不扎手，再用蜂蜡擦拭木面，令其更显温润。实际养护应根据木材与产品说明进行，避免长时间浸水。'},
{id:'motifs',title:'纹样寓意',desc:'解锁四种传统纹样',small:'把祝愿刻进梳背。',body:'选择纹样卡片，了解它们寄托的美好寓意。'},
{id:'memory',title:'拾起记忆',desc:'收集一段温暖回忆',small:'木梳也承载着家人的关怀。',body:'选择一段回忆，拾起木梳背后的温情。'}];
const motifs=[['祥云','☁','祥云寓意吉祥，寄托对平安顺遂的祝愿。'],['牡丹','✿','牡丹象征繁盛与美好生活，寄托富足的愿望。'],['卷草','❧','卷草纹枝蔓连绵，寓意生生不息、绵长不断。'],['如意','⌘','如意寄托称心顺意、安康圆满的愿望。']];
const toolData=[['wood','🪵','红木料','选料'],['knife','🔪','刻刀','开齿成形'],['sand','▤','细砂纸','细磨'],['wax','✦','蜂蜡','上蜡养护']];
function startGame(){document.getElementById('home').style.display='none';document.getElementById('level').style.display='flex';render();showModal('巷口来信','陈师傅：来啦？木头有木头的脾气，做梳子得慢慢来。先认识这门手艺，再亲手做一把。')}
function render(){const host=document.getElementById('tiles');host.innerHTML='';steps.forEach(s=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<b>'+(state.done.has(s.id)?'✓ ':'')+s.title+'</b><small>'+s.desc+'<br>'+s.small+'</small>';b.onclick=()=>act(s);host.appendChild(b)});document.getElementById('count').textContent=state.done.size+'/6';document.getElementById('bar').style.width=(state.done.size/6*100)+'%'}
function act(s){if(s.id==='motifs'){showMotifs();return}if(s.id==='memory'){showMemories();return}if(['wood','teeth','finish'].includes(s.id)){showCraft(s);return}state.done.add(s.id);document.getElementById('notice').textContent='已记录：'+s.title+'。继续探索其他内容吧。';render();showModal(s.title,s.body)}
function showCraft(s){let title=s.title;document.getElementById('mtitle').textContent='工坊工序 · '+title;document.getElementById('mbody').innerHTML='<p>'+s.body+'</p><p>选择工具，再点击对应工序，完成后会记录进度。</p><div class="craftrow">'+toolData.map(t=>'<button class="craft '+(state.tools.has(t[0])?'done':'')+'" onclick="useTool(\''+t[0]+'\',\''+s.id+'\')"><span>'+t[1]+'</span><br>'+t[2]+'<br><small>'+(state.tools.has(t[0])?'已完成':'点击使用')+'</small></button>').join('')+'</div><p id="craftNote">每件工具用于对应的工序。</p>';document.getElementById('mextra').innerHTML='';document.getElementById('modal').classList.add('open')}
function useTool(tool,stage){const correct={wood:'wood',knife:'teeth',sand:'finish',wax:'finish'};if(correct[tool]!==stage){document.getElementById('craftNote').textContent='这件工具不适合当前工序，再选一次试试。';return}state.tools.add(tool);state.done.add(stage);document.getElementById('craftNote').textContent='完成！'+toolData.find(t=>t[0]===tool)[2]+'已用于「'+stageLabel(stage)+'」。';document.getElementById('notice').textContent='已完成工序：'+stageLabel(stage);render();showCraft(steps.find(s=>s.id===stage))}
function stageLabel(id){return ({wood:'挑选木料',teeth:'开齿成形',finish:'细磨上蜡'})[id]||id}
function showMotifs(){document.getElementById('mtitle').textContent='传统纹样 · 选择一张卡片';document.getElementById('mbody').innerHTML='<p>点选纹样，了解它承载的祝愿。</p><div class="patterns">'+motifs.map(m=>'<button class="pattern" onclick="chooseMotif(\''+m[0]+'\')"><span>'+m[1]+'</span><b>'+m[0]+'</b><small>'+(state.motifs.has(m[0])?'✓ 已收集':'点击解锁')+'</small></button>').join('')+'</div>';document.getElementById('mextra').innerHTML='';document.getElementById('modal').classList.add('open')}
function chooseMotif(n){const m=motifs.find(x=>x[0]===n);state.motifs.add(n);state.done.add('motifs');document.getElementById('notice').textContent='已发现纹样：'+n+'（'+state.motifs.size+'/4）';render();document.getElementById('mtitle').textContent=m[0]+'纹';document.getElementById('mbody').innerHTML='<p style="font-size:22px;text-align:center">'+m[1]+'</p><p>'+m[2]+'</p><p>已收集 '+state.motifs.size+' / 4 种纹样。</p>';document.getElementById('mextra').innerHTML='<button onclick="showMotifs()">继续收集纹样</button>'}
function showMemories(){document.getElementById('mtitle').textContent='记忆支线 · 选择一段回忆';document.getElementById('mbody').innerHTML='<div class="grid"><button class="tile" onclick="memory(\'奶奶梳头\')"><b>奶奶梳头</b><small>午后窗边，一把木梳和一双温暖的手。</small></button><button class="tile" onclick="memory(\'童年工坊\')"><b>童年工坊</b><small>木屑在阳光里飞舞，木香留在记忆里。</small></button></div>';document.getElementById('mextra').innerHTML='';document.getElementById('modal').classList.add('open')}
function memory(n){state.memories.add(n);state.done.add('memory');document.getElementById('mtitle').textContent=n;document.getElementById('mbody').innerHTML='<p>'+(n==='奶奶梳头'?'奶奶坐在窗边，木梳轻轻划过发梢。那份温柔，随着岁月留在心里。':'小时候，我总爱蹲在陈师傅的工作台边。刨花卷成薄薄的弧，木屑在阳光里慢慢飘，木香成了老巷的记忆。')+'</p><p>有些爱，藏在每天重复的小事里。</p>';document.getElementById('mextra').innerHTML='';document.getElementById('notice').textContent='已拾起回忆：'+n;render()}
function showModal(t,b){document.getElementById('mtitle').textContent=t;document.getElementById('mbody').innerHTML='<p>'+b+'</p>';document.getElementById('mextra').innerHTML='';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openDesign(){document.getElementById('mtitle').textContent='梳背雕花设计';document.getElementById('mbody').innerHTML='<p>选择纹样，再点击画板放置。作品最多放置三枚纹样。</p><div class="design"><canvas id="designCanvas" width="700" height="350"></canvas><aside><h3>选择纹样</h3>'+motifs.map(m=>'<button onclick="selected=\''+m[0]+'\';document.getElementById(\'designHint\').textContent=\'当前纹样：'+m[0]+'\'">'+m[1]+' '+m[0]+'</button>').join('')+'<p id="designHint">当前纹样：祥云</p><button onclick="undoMotif()">撤销一枚</button><button onclick="clearDesign()">清空画板</button><button onclick="saveDesign()">下载作品 PNG</button></aside></div>';document.getElementById('mextra').innerHTML='';document.getElementById('modal').classList.add('open');selected=selected||'祥云';drawDesign();document.getElementById('designCanvas').onclick=e=>{if(state.placed.length>=3){document.getElementById('designHint').textContent='最多放置三枚，请先撤销。';return}state.placed.push(selected);drawDesign();document.getElementById('designHint').textContent='已放置 '+state.placed.length+' / 3 枚纹样。'} }
let selected='祥云';
function drawDesign(){const c=document.getElementById('designCanvas');if(!c)return;const x=c.getContext('2d'),w=c.width,h=c.height;x.fillStyle='#f8edda';x.fillRect(0,0,w,h);x.fillStyle='#e9d6b1';x.fillRect(0,h*.86,w,h*.14);x.save();x.translate(w/2,h*.4);x.rotate(-.03);x.fillStyle='#99582f';x.strokeStyle='#60381f';x.lineWidth=5;x.beginPath();x.moveTo(-w*.32,-h*.17);x.quadraticCurveTo(-w*.34,-h*.3,-w*.22,-h*.3);x.lineTo(w*.22,-h*.3);x.quadraticCurveTo(w*.34,-h*.3,w*.32,-h*.17);x.lineTo(w*.32,h*.02);x.lineTo(-w*.32,h*.02);x.closePath();x.fill();x.stroke();for(let i=0;i<27;i++){x.fillStyle=i%2?'#bd8750':'#81502e';x.fillRect(-w*.32+i*w*.64/27,h*.02,w*.64/32,h*.23)}state.placed.forEach((n,i)=>{x.fillStyle='#f2d08b';x.font='40px serif';x.textAlign='center';x.fillText(motifs.find(m=>m[0]===n)[1],-w*.2+i*w*.2,-h*.12)});x.restore();x.fillStyle='#80613d';x.font='16px sans-serif';x.textAlign='center';x.fillText('梳忆 · 专属木梳',w/2,h*.96)}
function undoMotif(){state.placed.pop();drawDesign()}function clearDesign(){state.placed=[];drawDesign()}function saveDesign(){const c=document.getElementById('designCanvas');const a=document.createElement('a');a.download='梳忆-我的木梳.png';a.href=c.toDataURL('image/png');a.click();state.done.add('design');document.getElementById('notice').textContent='作品已导出！你的木梳设计已经完成。';render()}
function restartGame(){state.done.clear();state.motifs.clear();state.memories.clear();state.tools.clear();state.placed=[];document.getElementById('level').style.display='none';document.getElementById('home').style.display='flex';document.getElementById('notice').textContent='选择一项开始探索。';render()}
render();
</script></body></html>
