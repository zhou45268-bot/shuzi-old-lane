<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#24160f"><title>梳忆·老巷木梳坊</title>
<style>
:root{--gold:#e8c37c;--ink:#29180f;--paper:#f6e6c6}*{box-sizing:border-box}body{margin:0;background:#1d120d;color:var(--paper);font-family:"Microsoft YaHei",serif}button{font:inherit;cursor:pointer;color:#ffe8b0;background:linear-gradient(#684426,#352015);border:1px solid #c49a54;border-radius:28px;padding:12px 24px;box-shadow:0 4px 15px #10090488}button:hover{filter:brightness(1.2)}.screen{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;padding:24px;background-position:center;background-size:cover;isolation:isolate}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#160d09a8,#160d0940,#160d09a8);z-index:-1}.home{background-image:url('assets/home.png'),radial-gradient(ellipse at 50% 42%,#7e8b8a,#463b31 55%,#160d09)}.level{display:none;background-image:url('assets/level.png'),radial-gradient(ellipse at 50% 30%,#9a9875,#59412a 50%,#160d09)}.panel{width:min(760px,100%);text-align:center;padding:clamp(22px,5vw,54px);background:#24160fd9;border:1px solid #c9a260;border-radius:8px;box-shadow:0 20px 80px #090604aa;backdrop-filter:blur(4px)}h1{font-size:clamp(42px,8vw,84px);letter-spacing:.15em;margin:0;color:#f2d49a;text-shadow:0 4px 10px #100905}h2{color:#f3d7a2;letter-spacing:.15em}p{line-height:1.9}.sub{letter-spacing:.25em;color:#f4dfbd}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{border:1px solid #b99051;background:#21140dd9;padding:8px 14px;border-radius:30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.tile{padding:18px 10px;background:#593a25d9;border:1px solid #b58b4e;border-radius:8px;min-height:100px}.tile b{display:block;color:#f5d8a0;margin-bottom:7px}.notice{min-height:56px;color:#f8dfaa}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#100904c9;z-index:10}.modal.open{display:flex}.modalbox{width:min(620px,100%);padding:28px;background:#f3e2c0;color:#382418;border:5px double #9b7139;border-radius:8px}.modalbox h2{color:#67401e}.modalbox button{margin-top:10px}.progress{height:7px;background:#4b3020;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#e6bf71;transition:width .3s}.footer{font-size:12px;color:#dfc7a0;margin-top:24px}@media(max-width:520px){.grid{grid-template-columns:1fr}.screen{padding:14px}.panel{padding:22px 16px}.top{top:10px;left:10px;right:10px}}
</style></head>
<body>
<main id="home" class="screen home"><section class="panel"><p class="sub">苏州木作非遗 · 水巷间的记忆</p><h1>梳忆</h1><h2>老巷木梳坊</h2><p>一把木梳，梳理岁月；一段旧巷，拾起记忆。<br>跟随陈师傅，学习苏式木梳制作工艺。</p><div class="actions"><button onclick="startGame()">〈 开启记忆 〉</button><button onclick="showModal('图鉴','收集祥云、牡丹、卷草、如意四种传统纹样，了解它们寄托的美好寓意。')">▧ 游历图鉴</button><button onclick="showModal('工坊设置','本游戏支持鼠标与触屏操作。建议使用 Chrome 或 Edge 浏览器，以全屏模式体验。')">⚙ 工坊设置</button></div><p class="footer">梳忆·老巷木梳坊 · 非遗文化互动体验</p></section></main>
<main id="level" class="screen level"><div class="top"><span class="pill">工坊学徒 · 记忆进度 <b id="count">0/6</b></span><span><button onclick="showModal('游历图鉴','已发现纹样：'+(state.motifs.size?[...state.motifs].join('、'):'尚未发现')+'。点击关卡中的纹样卡片可解锁更多知识。')">图鉴</button> <button onclick="showModal('工坊设置','鼠标或触屏均可点击操作。点击右上角返回首页可重新开始。')">设置</button></span></div><section class="panel"><p class="sub">陈师傅的木梳工坊</p><h1 style="font-size:clamp(32px,6vw,54px)">承艺制梳</h1><p id="intro">陈师傅：好孩子，做一把好梳子，先要认识木料与工具。咱们一步一步来。</p><div class="progress"><span id="bar"></span></div><div class="grid" id="tiles"></div><p id="notice" class="notice">选择一项开始探索。</p><div class="actions"><button onclick="showModal('陈师傅','梳子要圆，齿要顺，就像做人，要懂迂回，要知和顺。做手艺要有耐心，做人也一样。')">听陈师傅说</button><button onclick="showModal('回到首页','要重新开始这段记忆吗？',true)">返回首页</button></div><p class="footer">点击卡片了解工艺；完成制作、纹样与回忆任务，收集完整记忆。</p></section></main>
<div id="modal" class="modal"><div class="modalbox"><h2 id="mtitle"></h2><p id="mbody"></p><div id="mextra"></div><button onclick="closeModal()">知道了</button></div></div>
<script>
const state={done:new Set(),motifs:new Set(),memories:new Set(),stage:0};const steps=[
{title:'旧时光影',desc:'点击了解苏州木梳工艺',body:'苏式木梳制作讲究选材、开齿、打磨与上蜡。匠人凭经验顺着木纹加工，让梳齿整齐、梳背温润。',id:'history'},
{title:'挑选木料',desc:'认识红木与木纹',body:'选材要观察木纹、硬度与完整度。合适的木料，是一把好梳子的起点。',id:'wood'},
{title:'开齿成形',desc:'细致开出梳齿',body:'开齿讲究间距均匀、齿尖顺滑，力度要稳，才能避免崩齿。',id:'teeth'},
{title:'细磨上蜡',desc:'让梳身温润顺手',body:'细细打磨边角，再用蜂蜡擦拭，让木面更加温润，也让手感更舒适。',id:'finish'},
{title:'纹样寓意',desc:'发现传统雕刻纹样',body:'祥云寓意吉祥，牡丹象征富贵，卷草纹象征生生不息，如意寄托顺遂安康。',id:'motifs'},
{title:'拾起记忆',desc:'听听旧时光的故事',body:'一把梳子连接着家人的关怀，也记下老巷工坊里代代相传的手艺。',id:'memory'}];
const motifs=[['祥云','☁','吉祥如意，寄托对平安顺遂的祝愿。'],['牡丹','✿','花开富贵，象征美好生活与繁盛。'],['卷草','❧','枝蔓绵延，寓意生生不息、绵长不断。'],['如意','⌘','称心如意，寄托安康顺遂的愿望。']];
function startGame(){document.getElementById('home').style.display='none';document.getElementById('level').style.display='flex';render()}
function render(){const host=document.getElementById('tiles');host.innerHTML='';steps.forEach((s,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<b>'+(state.done.has(s.id)?'✓ ':'')+s.title+'</b>'+s.desc;b.onclick=()=>act(s);host.appendChild(b)});document.getElementById('count').textContent=state.done.size+'/6';document.getElementById('bar').style.width=(state.done.size/6*100)+'%'}
function act(s){if(s.id==='motifs'){showMotifs();return}if(s.id==='memory'){showMemories();return}showModal(s.title,s.body);state.done.add(s.id);document.getElementById('notice').textContent='已记录：'+s.title+'。继续探索其他内容吧。';render()}
function showMotifs(){let html='<div class="grid">'+motifs.map(m=>'<button class="tile" onclick="chooseMotif(\''+m[0]+'\')"><b>'+m[1]+' '+m[0]+'</b>点击查看寓意</button>').join('')+'</div>';showModal('传统纹样', '选择一张纹样卡片，了解它承载的祝愿。');document.getElementById('mextra').innerHTML=html}
function chooseMotif(n){let m=motifs.find(x=>x[0]===n);state.motifs.add(n);state.done.add('motifs');document.getElementById('mtitle').textContent=m[0]+'纹';document.getElementById('mbody').textContent=m[2];document.getElementById('mextra').innerHTML='<p>已发现 '+state.motifs.size+'/4 种纹样</p>';document.getElementById('notice').textContent='已发现纹样：'+n;render()}
function showMemories(){showModal('记忆支线','选择一段回忆，拾起木梳背后的温情。');document.getElementById('mextra').innerHTML='<div class="grid"><button class="tile" onclick="memory(\'祖母梳头\')"><b>祖母梳头</b>小时候，祖母总会耐心为我梳头。</button><button class="tile" onclick="memory(\'童年工坊\')"><b>童年工坊</b>第一次走进工坊，木香留在记忆里。</button></div>'}
function memory(n){state.memories.add(n);state.done.add('memory');document.getElementById('mtitle').textContent=n;document.getElementById('mbody').textContent=n==='祖母梳头'?'祖母手里的木梳轻轻划过发梢。那份温柔，随着岁月留在心里。':'木屑在阳光里飞舞，陈师傅手中的刻刀稳稳向前。从那时起，木香成了老巷的记忆。';document.getElementById('mextra').innerHTML='';document.getElementById('notice').textContent='已拾起回忆：'+n;render()}
function showModal(t,b,confirm){document.getElementById('mtitle').textContent=t;document.getElementById('mbody').textContent=b;document.getElementById('mextra').innerHTML=confirm?'<button onclick="location.reload()">确认返回</button>':'';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('mextra').innerHTML='';if(state.done.size===6){document.getElementById('notice').textContent='记忆已完整收集。梳子要圆，齿要顺，就像做人，要懂迂回，要知和顺。'}}
render();
</script></body></html>
